# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["pymunk"]
entry = "pymunk:Space"
fmi_version = 3
call = "step"

[parameters]
threaded = { start = false }  # kept as an attribute: add variability = "tunable" if the step reads it

[inputs]
dt = { start = 0.01 }  # start from --start

[outputs]
collision_bias = {}  # a property of the object
collision_persistence = {}  # a property of the object
collision_slop = {}  # a property of the object
current_time_step = {}  # a property of the object
damping = {}  # a property of the object
idle_speed_threshold = {}  # a property of the object
iterations = {}  # a property of the object
sleep_time_threshold = {}  # a property of the object
threads = {}  # a property of the object

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
