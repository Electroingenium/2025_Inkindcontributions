# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["heartpy", "setuptools<81"]
entry = "heartpy:process"
fmi_version = 3

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line.
[model.constants]
hrdata = { call = "heartpy:get_data(\"data.csv\")" }  # computed when the FMU initializes
# measures = { python = "None" }
# working_data = { python = "None" }

[inputs]
sample_rate = { start = 100.0 }  # start from --start
windowsize = { start = 0.75 }
report_time = { start = false }
calc_freq = { start = false }
freq_method = { start = "welch" }
welch_wsize = { start = 240 }  # Integer because the default is an int; write a float start for Real
freq_square = { start = false }
interp_clipping = { start = false }
clipping_scale = { start = false }
interp_threshold = { start = 1020 }  # Integer because the default is an int; write a float start for Real
hampel_correct = { start = false }
bpmmin = { start = 40 }  # Integer because the default is an int; write a float start for Real
bpmmax = { start = 180 }  # Integer because the default is an int; write a float start for Real
reject_segmentwise = { start = false }
high_precision = { start = false }
high_precision_fs = { start = 1000.0 }
breathing_method = { start = "welch" }
clean_rr = { start = false }
clean_rr_method = { start = "quotient-filter" }

[outputs]
# probe call failed (FileNotFoundError('data.csv not found.')); outputs below are read from the code
y0 = { from = "return:0" }  # from the code; not seen in the probe
y1 = { from = "return:1" }  # from the code; not seen in the probe

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
