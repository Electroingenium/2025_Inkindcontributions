# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["tmm"]
entry = "tmm:coh_tmm"
fmi_version = 3

[model.constants]
n_list = { call = "numpy:array([1.0,1.5,1.0])" }  # computed when the FMU initializes
d_list = { call = "numpy:array([1e400,100.0,1e400])" }  # computed when the FMU initializes

[inputs]
pol = { start = "s" }  # start from --start
th_0 = { start = 0.0 }  # start from --start
lam_vac = { start = 500.0 }  # start from --start

[outputs]
R = {}
T = {}
power_entering = {}
kz_list = { dimensions = [3] }
th_list = { dimensions = [3] }
n_list = { dimensions = [3] }
d_list = { dimensions = [3] }
# r: complex in the probe, and FMI has no complex type: uncomment its real and imaginary parts
# r_real = { from = "return:r.real" }
# r_imag = { from = "return:r.imag" }
# t: complex in the probe, and FMI has no complex type: uncomment its real and imaginary parts
# t_real = { from = "return:t.real" }
# t_imag = { from = "return:t.imag" }
# vw_list: complex in the probe, and FMI has no complex type: uncomment its real and imaginary parts
# vw_list_real = { from = "return:vw_list.real", dimensions = [3, 2] }
# vw_list_imag = { from = "return:vw_list.imag", dimensions = [3, 2] }

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
