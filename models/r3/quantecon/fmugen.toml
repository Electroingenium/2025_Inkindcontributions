# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["quantecon"]
entry = "quantecon:LinearStateSpace"
fmi_version = 3
call = "stationary_distributions"
globals = ["quantecon.timings.timings:_DEFAULT_FLOAT_PRECISION"]  # module-level state the model changes while it runs: put back on reset and saved with the FMU state

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line.
[model.constants]
A = { call = "numpy:array([[0.9]])" }  # computed when the FMU initializes
C = { call = "numpy:array([[1.0]])" }  # computed when the FMU initializes
G = { call = "numpy:array([[1.0]])" }  # computed when the FMU initializes
# H = { python = "None" }
# mu_0 = { python = "None" }
# Sigma_0 = { python = "None" }

[outputs]
y0 = { from = "return:0", dimensions = [1, 1] }
y1 = { from = "return:1", dimensions = [1, 1] }
y2 = { from = "return:2", dimensions = [1, 1] }
y3 = { from = "return:3", dimensions = [1, 1] }
y4 = { from = "return:4", dimensions = [1, 1] }
num_const = {}  # set by stationary_distributions()
sorted_idx = { dimensions = [1] }  # set by stationary_distributions()
P = { dimensions = [1, 1] }  # set by stationary_distributions()
A22 = { dimensions = [1, 1] }  # set by stationary_distributions()
C2 = { dimensions = [1, 1] }  # set by stationary_distributions()
mu_x = { dimensions = [1, 1] }  # set by stationary_distributions()
mu_y = { dimensions = [1, 1] }  # set by stationary_distributions()
Sigma_x = { dimensions = [1, 1] }  # set by stationary_distributions()
Sigma_y = { dimensions = [1, 1] }  # set by stationary_distributions()
Sigma_yx = { dimensions = [1, 1] }  # set by stationary_distributions()

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
