# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["statsmodels"]
entry = "statsmodels.stats.proportion:proportion_confint"
fmi_version = 3

[inputs]
count = { start = 40 }  # start from --start
nobs = { start = 100 }  # start from --start
alpha = { start = 0.05 }
method = { start = "normal" }
alternative = { start = "two-sided" }

[outputs]
y = { from = "return", dimensions = [2] }
# y0: not in what the probe's call returned; reading it fails the step whenever the model doesn't return it
# y0 = { from = "return:0" }
# y1: not in what the probe's call returned; reading it fails the step whenever the model doesn't return it
# y1 = { from = "return:1" }

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
