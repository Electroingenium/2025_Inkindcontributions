# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["anastruct"]
entry = "anastruct:SystemElements"
fmi_version = 3
setup = ["add_element([[0,0],[5,0]])", "add_support_hinged(1)", "add_support_roll(2)", "q_load(-10.0,1)"]
call = "solve"

[parameters]
figsize = { dimensions = [2], start = [12.0, 8.0] }  # kept as an attribute: add variability = "tunable" if the step reads it
EA = { start = 15000.0 }  # kept as an attribute: add variability = "tunable" if the step reads it
EI = { start = 5000.0 }  # kept as an attribute: add variability = "tunable" if the step reads it
load_factor = { start = 1.0 }  # kept as an attribute: add variability = "tunable" if the step reads it
mesh = { start = 50 }
invert_y_loads = { start = true }

[inputs]
force_linear = { start = false }
verbosity = { start = 0 }
max_iter = { start = 200 }
geometrical_non_linear = { start = false }

[outputs]
y = { from = "return", dimensions = [6] }
id_last_element = {}  # a property of the object
id_last_node = {}  # a property of the object
system_matrix = { dimensions = [6, 6] }  # set by solve()
system_force_vector = { dimensions = [6] }  # set by solve()
system_displacement_vector = { dimensions = [6] }  # set by solve()
shape_system_matrix = {}  # set by solve()
reduced_force_vector = { dimensions = [3] }  # set by solve()
reduced_system_matrix = { dimensions = [3, 3] }  # set by solve()

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
