# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["thermofeel"]
entry = "thermofeel:calculate_heat_index_simplified"
fmi_version = 3

[inputs]
t2_k = { start = 303.15 }  # start from --start
rh = { start = 60.0 }  # start from --start

[outputs]
# probe call failed (ValueError('Calling nonzero on 0d arrays is not allowed. Use np.atleast_1d(scalar).nonzero() instead. If the context of this error is of the form `arr[nonzero(cond)]`, just use `arr[cond]`.')); outputs below are read from the code

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
