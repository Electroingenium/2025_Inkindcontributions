# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["pykalman"]
entry = "pykalman:KalmanFilter"
fmi_version = 3
call = "filter_update"

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# transition_matrices = { python = "None" }
# observation_matrices = { python = "None" }
# transition_covariance = { python = "None" }
# observation_covariance = { python = "None" }
# transition_offsets = { python = "None" }
# observation_offsets = { python = "None" }
# initial_state_mean = { python = "None" }
# initial_state_covariance = { python = "None" }
# random_state = { python = "None" }
# em_vars = { python = "None" }
# n_dim_state = { python = "None" }
# n_dim_obs = { python = "None" }

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line.
[model.call_constants]
filtered_state_mean = { call = "numpy:zeros(1)" }  # computed when the FMU initializes
filtered_state_covariance = { call = "numpy:eye(1)" }  # computed when the FMU initializes
# transition_matrix = { python = "None" }
# transition_offset = { python = "None" }
# transition_covariance = { python = "None" }
# observation_matrix = { python = "None" }
# observation_offset = { python = "None" }
# observation_covariance = { python = "None" }

[inputs]
observation = { start = 1.0 }  # start from --start

[outputs]
y0 = { from = "return:0", dimensions = [1] }
y1 = { from = "return:1", dimensions = [1, 1] }

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
