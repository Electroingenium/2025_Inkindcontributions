[project]
name = "fmugen"
version = "0.1.0"
description = "Turn ordinary Python models into FMI 2.0 / 3.0 Co-Simulation FMUs (UniFMU), without changing their code"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Tomas Robino" }]
keywords = ["fmi", "fmu", "co-simulation", "unifmu", "simulation", "digital twin", "modelica"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
]
# The FMU runs with the Python fmugen is installed in (the model's virtual environment),
# so that environment needs what UniFMU 0.14's Python backend imports.
dependencies = [
    "protobuf==5.27.3",
    "pyzmq>=27.2.0",
]

[project.scripts]
fmugen = "fmugen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmugen"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # tests validate and simulate the FMUs with FMPy
    "fmpy>=0.3.32",
    # example models
    "filterpy==1.4.5",
    "simple-pid==2.0.1",
]
