[project]
name = "2025-inkindcontributions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "coloredlogs>=15.0.1",
    "fmpy>=0.3.32",
    "protobuf==5.27.3",
    "pyzmq>=27.2.0",
    "toml>=0.10.2",
]

[project.scripts]
fmugen = "fmugen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmugen"]
