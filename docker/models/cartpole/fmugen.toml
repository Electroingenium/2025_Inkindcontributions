# fmugen.toml: Gymnasium's CartPole (gymnasium 1.3.0, MIT), used as published from PyPI.
# Started with
#   fmugen init gymnasium.envs.classic_control.cartpole:CartPoleEnv --fmi 3 --call step --setup reset --start action=1 --probe
# then the outputs were named after step()'s (observation, reward, terminated, truncated, info),
# reset was seeded and the rendering surface was removed.

[model]
entry = "gymnasium.envs.classic_control.cartpole:CartPoleEnv"
requirements = ["gymnasium==1.3.0"]
fmi_version = 3
name = "cartpole"
setup = ["reset(seed=0)"]
call = "step"

[experiment]
stop_time = 20.0
step_size = 1.0

[parameters]
sutton_barto_reward = { start = false }

[inputs]
action = { start = 1, description = "0: push the cart left, 1: push it right" }

[outputs]
observation = { from = "return:0", dimensions = [4], type = "Float32", description = "cart position, cart velocity, pole angle, pole angular velocity" }
reward = { from = "return:1" }
terminated = { from = "return:2", type = "Boolean", description = "the pole fell or the cart left the track" }
truncated = { from = "return:3", type = "Boolean" }

[locals]
state = { dimensions = [4] }  # changed by step()
