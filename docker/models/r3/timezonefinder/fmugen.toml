# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["timezonefinder"]
entry = "timezonefinder:TimezoneFinder"
fmi_version = 3
call = "timezone_at"
save_state = false  # the model object can't be pickled (TypeError: cannot pickle 'FileIO' instances): the FMU can't save and restore its state

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# bin_file_location = { python = "None" }

[parameters]
in_memory = { start = false }

[inputs]
lng = { start = -3.7 }  # start from --start
lat = { start = 40.4 }  # start from --start

[outputs]
y = { from = "return", type = "String" }
data_version = { type = "String" }  # a property of the object
nr_of_holes = {}  # a property of the object
nr_of_polygons = {}  # a property of the object
nr_of_zones = {}  # a property of the object

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
