# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["pythermalcomfort"]
entry = "pythermalcomfort.models:pmv_ppd_iso"
fmi_version = 3
globals = ["pythermalcomfort.jos3_functions.thermoregulation:PRE_SHIV"]  # module-level state the model changes while it runs: put back on reset and saved with the FMU state

[inputs]
tdb = { start = 25.0 }  # start from --start
tr = { start = 25.0 }  # start from --start
vr = { start = 0.1 }  # start from --start
rh = { start = 50.0 }  # start from --start
met = { start = 1.2 }  # start from --start
clo = { start = 0.5 }  # start from --start
wme = { start = 0 }  # Integer because the default is an int; write a float start for Real
model = { start = "7730-2025" }
units = { start = "SI" }
limit_inputs = { start = true }
round_output = { start = true }

[outputs]
pmv = {}
ppd = {}
tsv = { type = "String" }

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
