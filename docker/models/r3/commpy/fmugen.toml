# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["scikit-commpy"]
entry = "commpy.modulation:QAMModem"
fmi_version = 3
call = "modulate"

[model.call_constants]
input_bits = { call = "numpy:array([0,1,1,0])" }  # computed when the FMU initializes

[parameters]
m = { start = 4 }  # start from --start

[outputs]
# no outputs found: add [outputs] by hand (e.g. attributes or properties of the model object)
# y: complex in the probe, and FMI has no complex type: uncomment its real and imaginary parts
# y_real = { from = "return:real", dimensions = [2] }
# y_imag = { from = "return:imag", dimensions = [2] }

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
