# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["pyfluids"]
entry = "pyfluids:Fluid"
fmi_version = 3
call = "with_state"

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line.
[model.constants]
name = { call = "pyfluids:FluidsList.Water" }  # computed when the FMU initializes
# fraction = { python = "None" }
# coolprop_backend = { python = "None" }

[model.call_constants]
first_input = { call = "pyfluids:Input.pressure(101325)" }  # computed when the FMU initializes
second_input = { call = "pyfluids:Input.temperature(20)" }  # computed when the FMU initializes

[outputs]
# probe construction failed (TypeError("'FluidsList' object is not callable")); outputs below are read from the code
y = { from = "return" }  # from the code; not seen in the probe
fraction = {}  # from the code; not seen in the probe
coolprop_backend = { type = "String" }  # from the code; not seen in the probe
compressibility = {}  # from the code; not seen in the probe
conductivity = {}  # from the code; not seen in the probe
critical_pressure = {}  # from the code; not seen in the probe
critical_temperature = {}  # from the code; not seen in the probe
density = {}  # from the code; not seen in the probe
dynamic_viscosity = {}  # from the code; not seen in the probe
enthalpy = {}  # from the code; not seen in the probe
entropy = {}  # from the code; not seen in the probe
freezing_temperature = {}  # from the code; not seen in the probe
internal_energy = {}  # from the code; not seen in the probe
kinematic_viscosity = {}  # from the code; not seen in the probe
max_pressure = {}  # from the code; not seen in the probe
max_temperature = {}  # from the code; not seen in the probe
min_pressure = {}  # from the code; not seen in the probe
min_temperature = {}  # from the code; not seen in the probe
molar_mass = {}  # from the code; not seen in the probe
prandtl = {}  # from the code; not seen in the probe
pressure = {}  # from the code; not seen in the probe
quality = {}  # from the code; not seen in the probe
sound_speed = {}  # from the code; not seen in the probe
specific_heat = {}  # from the code; not seen in the probe
specific_volume = {}  # from the code; not seen in the probe
surface_tension = {}  # from the code; not seen in the probe
temperature = {}  # from the code; not seen in the probe
