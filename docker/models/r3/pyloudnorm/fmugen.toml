# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["pyloudnorm"]
entry = "pyloudnorm:Meter"
fmi_version = 3
call = "integrated_loudness"

[model.call_constants]
data = { call = "numpy:sin(numpy.linspace(0,2000,16000))" }  # computed when the FMU initializes

[parameters]
rate = { start = 8000 }  # start from --start
filter_class = { start = "K-weighting" }  # kept as an attribute: add variability = "tunable" if the step reads it
block_size = { start = 0.4 }  # kept as an attribute: add variability = "tunable" if the step reads it
overlap = { start = 0.75 }  # kept as an attribute: add variability = "tunable" if the step reads it

[outputs]
# probe call failed (AttributeError("module 'numpy' has no attribute 'linspace(0, 2000, 16000)'")); outputs below are read from the code
y = { from = "return" }  # from the code; not seen in the probe

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
