# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["pymap3d"]
entry = "pymap3d:geodetic2enu"
fmi_version = 3

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.constants]
# ell = { python = "None" }

[inputs]
lat = { start = 40.0 }  # start from --start
lon = { start = -3.0 }  # start from --start
h = { start = 100.0 }  # start from --start
lat0 = { start = 40.1 }  # start from --start
lon0 = { start = -3.1 }  # start from --start
h0 = { start = 0.0 }  # start from --start
deg = { start = true }

[outputs]
y = { from = "return", dimensions = [3] }

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
