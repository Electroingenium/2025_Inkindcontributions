# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["tellurium"]
entry = "tellurium:loada"
fmi_version = 3
call = "oneStep"
globals = ["tellurium.tellurium:__default_plotting_engine", "tellurium.tellurium:__save_plots_to_pdf"]  # module-level state the model changes while it runs: put back on reset and saved with the FMU state

[parameters]
ant = { start = "S1 -> S2; k1*S1; S1 = 10; k1 = 0.1" }  # start from --start

[inputs]
currentTime = { start = 0.0 }  # start from --start
stepSize = { start = 0.1 }  # start from --start
reset = { start = true }

[outputs]
y = { from = "return" }
seed = {}  # a property of the object

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
