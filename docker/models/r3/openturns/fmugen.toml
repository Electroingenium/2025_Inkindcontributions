# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["openturns"]
entry = "openturns:Normal"
fmi_version = 3
call = "computePDF"

[parameters]
mu = { start = 0.0, to = "pos:0" }  # start from --start, passed by position to *args: check the order
sigma = { start = 1.0, to = "pos:1" }  # start from --start, passed by position to *args: check the order
x = { start = 0.5, to = "pos:2" }  # start from --start, passed by position to *args: check the order

[outputs]
# probe construction failed (TypeError("Wrong number or type of arguments for overloaded function 'new_Normal'.\n  Possible C/C++ prototypes are:\n    OT::Normal::Normal(OT::UnsignedInteger const)\n    OT::Normal::Normal()\n    OT::Normal::Normal(OT::Scalar const,OT::Scalar const)\n    OT::Normal::Normal(OT::Point const &,OT::Point const &)\n    OT::Normal::Normal(OT::Point const &,OT::Point const &,OT::CorrelationMatrix const &)\n    OT::Normal::Normal(OT::Point const &,OT::CovarianceMatrix const &)\n    OT::Normal::Normal(OT::Normal const &)\n")); outputs below are read from the code
y = { from = "return" }  # from the code; not seen in the probe

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
