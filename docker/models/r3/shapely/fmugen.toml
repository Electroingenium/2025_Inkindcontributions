# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["shapely"]
entry = "shapely:Point"
fmi_version = 3
call = "svg"

# Arguments whose code default is not an FMI value; the default is used.
# To override one, uncomment the line and the table header.
# [model.call_constants]
# fill_color = { python = "None" }
# opacity = { python = "None" }

[parameters]
x = { start = 1.0, to = "pos:0" }  # start from --start, passed by position to *args: check the order
y = { start = 2.0, to = "pos:1" }  # start from --start, passed by position to *args: check the order

[inputs]
scale_factor = { start = 1.0 }

[outputs]
area = {}  # a property of the object
bounds = { dimensions = [4] }  # a property of the object
geom_type = { type = "String" }  # a property of the object
has_m = { type = "Boolean" }  # a property of the object
has_z = { type = "Boolean" }  # a property of the object
is_closed = { type = "Boolean" }  # a property of the object
is_empty = { type = "Boolean" }  # a property of the object
is_ring = { type = "Boolean" }  # a property of the object
is_simple = { type = "Boolean" }  # a property of the object
is_valid = { type = "Boolean" }  # a property of the object
length = {}  # a property of the object
minimum_clearance = {}  # a property of the object
type = { type = "String" }  # a property of the object
wkb = { type = "Binary" }  # a property of the object
wkb_hex = { type = "String" }  # a property of the object
wkt = { type = "String" }  # a property of the object

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
