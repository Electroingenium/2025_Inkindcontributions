# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Generated by `fmugen init`; check the start values, add units, and remove what you don't need.

[model]
requirements = ["opencv-python-headless"]
entry = "cv2:KalmanFilter"
fmi_version = 3
call = "predict"
save_state = false  # the model object can't be pickled (TypeError: cannot pickle 'cv2.KalmanFilter' object): the FMU can't save and restore its state

[parameters]
dynamParams = { start = 2, to = "pos:0" }  # start from --start, passed by position to *args: check the order
measureParams = { start = 1, to = "pos:1" }  # start from --start, passed by position to *args: check the order

[inputs]
# cannot inspect the signature of KalmanFilter.predict; add the variables by hand (to = "pos:N" for positional arguments)

[outputs]
y = { from = "return", dimensions = [2, 1], type = "Float32" }

# FMI 3 clocks run model code on events; they can't be inferred. Example (docs/models.md#clocks):
# [clocks.sample]
# interval = 0.1            # a periodic input clock, ticked by the importer
# call = "sample"           # method (or function) run when it ticks
# [inputs]
# measurement = { start = 0.0, clocks = ["sample"] }   # passed to sample()
