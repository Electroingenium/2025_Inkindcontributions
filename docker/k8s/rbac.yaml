# The UI starts, lists and removes run Jobs in its own namespace and reads their logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamlit-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fmu-runs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: streamlit-ui-fmu-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fmu-runs
subjects:
  - kind: ServiceAccount
    name: streamlit-ui
