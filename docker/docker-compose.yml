networks:
  simnet:
    name: simnet     # Fixed name, used by the FMU runs started from Streamlit
    driver: bridge

services:
  opcua-server:
    build: ./opcua_server
    container_name: opcua-server
    networks: [simnet]
    ports:
      - "4841:4840"
    environment:
      - FMU_PATH=/model/model.fmu
    volumes:
      - ./model:/model:ro

  streamlit-ui:
    build: ./streamlit_ui
    container_name: streamlit-ui
    networks: [simnet]
    ports: ["8501:8501"]
    depends_on: [opcua-server, fmu-client]
    environment:
      - OPCUA_ENDPOINT=opc.tcp://opcua-server:4840
      - DOCKER_NETWORK=simnet
      - FMU_IMAGE=fmu-client:latest
      - FMU_CONTAINER_NAME_BASE=fmu-run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./model:/model:ro
      - ./results:/results

  # Only builds the fmu-client image; Streamlit starts one container from it per run.
  fmu-client:
    build: ./fmu_client
    image: fmu-client:latest
    container_name: fmu-client
    networks: [simnet]
    environment:
      - OPCUA_ENDPOINT=opc.tcp://opcua-server:4840
      - FMU_PATH=/model/model.fmu
      - RESULTS_DIR=/results
      - OPC_WAIT=10
    volumes:
      - ./model:/model:ro
      - ./results:/results
    entrypoint: ["tail", "-f", "/dev/null"]
