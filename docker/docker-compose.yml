# Local stack. For Kubernetes / Liqo see k8s/ and liqo/.
# Another model: MODEL=examples/simple_pid docker compose up --build
networks:
  simnet:
    name: simnet     # Fixed name, used by the FMU runs started from Streamlit
    driver: bridge

x-image: &image
  image: fmugen-sim:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      MODEL: ${MODEL:-examples/psychrometry}
      FMUGEN_ARGS: ${FMUGEN_ARGS:-}
      PREBUILT: ${PREBUILT:-0}

services:
  opcua-server:
    <<: *image
    container_name: opcua-server
    command: ["python", "opcua_server.py"]
    networks: [simnet]
    ports:
      - "4841:4840"

  streamlit-ui:
    <<: *image
    container_name: streamlit-ui
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    networks: [simnet]
    ports: ["8501:8501"]
    depends_on: [opcua-server]
    environment:
      - OPCUA_ENDPOINT=opc.tcp://opcua-server:4840
      - RUN_BACKEND=docker
      - DOCKER_NETWORK=simnet
      - FMU_IMAGE=fmugen-sim:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
