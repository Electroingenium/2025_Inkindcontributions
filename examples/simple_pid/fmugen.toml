# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Started with `fmugen init simple_pid:PID`, then reviewed by hand.
#
# There is no model file here: the model is the PID class from the simple-pid package
# on PyPI, used exactly as published. It must be installed in the environment fmugen runs in.

[model]
entry = "simple_pid:PID"         # an installed module, not a file
requirements = ["simple-pid==2.0.1"]
name = "pid"
description = "PID controller (simple-pid 2.0.1)"

[model.constants]
# simple-pid's defaults that are not FMI values
output_limits = { python = "(-100.0, 100.0)" }   # also prevents integral windup
sample_time = { python = "None" }                # compute on every step; the FMU step is the sample time

[experiment]
step_size = 0.1
stop_time = 10.0

[time]
dt = "step_size"                 # PID.__call__(input_, dt): pass the FMU step size as dt

[parameters]
# PID(...) arguments. __call__ reads these attributes every step, so they are tunable.
Kp       = { start = 2.0, variability = "tunable", description = "proportional gain" }
Ki       = { start = 0.5, variability = "tunable", description = "integral gain" }
Kd       = { start = 0.0, variability = "tunable", description = "derivative gain" }
setpoint = { start = 1.0, variability = "tunable" }
auto_mode = { start = true, variability = "tunable", description = "false: hold the last output" }
proportional_on_measurement = { start = false }

[inputs]
measurement = { start = 0.0, to = "arg:input_" }   # FMU name 'measurement' -> argument input_

[outputs]
output = { from = "return" }     # __call__ returns the control output

[locals]
integral = { from = "attr:_integral", description = "integral term (internal state)" }
