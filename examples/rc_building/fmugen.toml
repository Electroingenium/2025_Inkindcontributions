# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
# Started with `fmugen init rc_simulator/building_physics.py:Zone --call solve_energy`,
# then trimmed to the interesting variables and given units.

[model]
entry = "rc_simulator/building_physics.py:Zone"
call = "solve_energy"            # Zone(...) is built on initialization; solve_energy(...) runs each step
sources = ["rc_simulator"]       # building_physics does `import supply_system`, `import emission_system`
name = "rc_building_zone"
description = "ISO 13790 5R1C thermal zone (RC_BuildingSimulator), hourly"

[model.constants]
# Zone arguments that are classes, not FMI values. Resolved by import at runtime.
heating_supply_system = { ref = "supply_system:HeatPumpAir" }
cooling_supply_system = { ref = "supply_system:HeatPumpAir" }

[experiment]
# The model hard-codes a 1 h time step (c_m / 3600), so the FMU refuses any other step size.
step_size = 3600.0
fixed_step = true
stop_time = 172800.0

[parameters]
# Constructor arguments: fixed, used once when the Zone is built.
window_area   = { start = 4.0,   unit = "m2" }
walls_area    = { start = 11.0,  unit = "m2" }
floor_area    = { start = 35.0,  unit = "m2" }
room_vol      = { start = 105.0, unit = "m3" }
u_walls       = { start = 0.2,   unit = "W/(m2.K)" }
u_windows     = { start = 1.1,   unit = "W/(m2.K)" }
ach_vent      = { start = 1.5,   unit = "1/h", description = "air changes per hour, ventilation" }
ach_infl      = { start = 0.5,   unit = "1/h", description = "air changes per hour, infiltration" }
ventilation_efficiency = { start = 0.6, min = 0.0, max = 1.0 }
thermal_capacitance_per_floor_area = { start = 165000.0, unit = "J/(m2.K)" }
# solve_energy reads these attributes every step, so they can change during the simulation.
t_set_heating = { start = 20.0, unit = "degC", variability = "tunable" }
t_set_cooling = { start = 26.0, unit = "degC", variability = "tunable" }

[calculated_parameters]
# Attributes the constructor derives from the parameters.
c_m     = { unit = "J/K", description = "thermal capacitance of the zone" }
h_tr_em = { unit = "W/K", description = "conductance of opaque surfaces to exterior" }
h_tr_w  = { unit = "W/K", description = "conductance of windows to exterior" }

[inputs]
t_out          = { start = 10.0, unit = "degC" }
internal_gains = { start = 0.0,  unit = "W" }
solar_gains    = { start = 0.0,  unit = "W" }

[states]
# solve_energy(..., t_m_prev) needs last step's mass temperature, which it stores as t_m_next.
t_m_prev = { start = 20.0, unit = "degC", next = "attr:t_m_next" }

[outputs]
# solve_energy returns nothing; it stores its results as attributes of the Zone.
t_air          = { start = 20.0, unit = "degC" }  # value before the first step
heating_demand = { unit = "W" }
cooling_demand = { unit = "W" }
heating_sys_electricity = { unit = "W" }
cooling_sys_electricity = { unit = "W" }

[locals]
t_m = { unit = "degC", description = "mean thermal mass temperature over the step" }
t_s = { unit = "degC", description = "surface temperature" }
cop = { description = "coefficient of performance (NaN without demand)" }
