# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
#
# filterpy's KalmanFilter, used as published, tracking position and velocity from noisy
# position measurements: predict() runs on every step, update(z) runs when a measurement
# arrives (an FMI 3 triggered clock). Matrices are FMI 3 arrays sized by structural parameters.

[model]
entry = "filterpy.kalman:KalmanFilter"
requirements = ["filterpy==1.4.5"]
fmi_version = 3
call = "predict"                 # the time update, on every doStep
name = "kalman"
description = "Linear Kalman filter (filterpy 1.4.5), constant-velocity model"

[experiment]
step_size = 0.1                  # F below assumes this step size
fixed_step = true
stop_time = 5.0

[structural_parameters]
# KalmanFilter(dim_x, dim_z): the array sizes below follow these.
dim_x = { start = 2, description = "state size: position, velocity" }
dim_z = { start = 1, description = "measurement size: position" }

[parameters]
# Matrices are attributes of the filter (kf.F = ...), so they are written onto the object.
F = { dimensions = ["dim_x", "dim_x"], numpy = true, to = "attr:F", start = [1.0, 0.1, 0.0, 1.0], description = "state transition" }
H = { dimensions = ["dim_z", "dim_x"], numpy = true, to = "attr:H", start = [1.0, 0.0], description = "measurement function" }
Q = { dimensions = ["dim_x", "dim_x"], numpy = true, to = "attr:Q", start = [0.0001, 0.0, 0.0, 0.001], description = "process noise" }
R = { dimensions = ["dim_z", "dim_z"], numpy = true, to = "attr:R", start = [0.25], description = "measurement noise" }

[clocks.measurement]
# interval_variability = "triggered" (the default without an interval): the importer ticks
# it whenever a measurement arrives.
call = "update"
description = "a new position measurement is available"

[inputs]
z = { dimensions = ["dim_z"], numpy = true, clocks = ["measurement"], unit = "m" }   # update(z)

[outputs]
x = { dimensions = ["dim_x"], description = "state estimate [position, velocity]" }
P = { dimensions = ["dim_x", "dim_x"], description = "state covariance" }
y = { dimensions = ["dim_z"], clocks = ["measurement"], description = "innovation of the last update" }
