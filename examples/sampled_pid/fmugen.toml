# fmugen.toml: how this Python model becomes an FMU. Reference: docs/config.md
#
# The same simple-pid PID class as examples/simple_pid, but as a sampled-data controller:
# instead of running on every doStep, it runs when the FMI 3 clock `sample` ticks.

[model]
entry = "simple_pid:PID"
requirements = ["simple-pid==2.0.1"]
fmi_version = 3                  # clocks need FMI 3
call = false                     # nothing runs on doStep; the clock below runs the PID
name = "sampled_pid"
description = "PID controller (simple-pid 2.0.1) sampled by a periodic clock"

[model.constants]
output_limits = { python = "(-100.0, 100.0)" }
sample_time = { python = "None" }   # the clock decides when the PID runs

[experiment]
step_size = 0.05                 # the importer's communication step: independent of the sample rate
stop_time = 2.0

[time]
dt = "step_size"                 # in a clock call: the time since the clock last ticked

[clocks.sample]
interval = 0.1                   # a periodic input clock: the importer ticks it every 0.1 s
call = "__call__"                # pid(measurement, dt) runs on every tick
description = "controller sample clock"

[parameters]
Kp       = { start = 2.0, variability = "tunable" }
Ki       = { start = 0.5, variability = "tunable" }
Kd       = { start = 0.0, variability = "tunable" }
setpoint = { start = 1.0, variability = "tunable" }

[inputs]
measurement = { start = 0.0, to = "arg:input_", clocks = ["sample"] }   # sampled at each tick

[outputs]
output = { from = "return", clocks = ["sample"] }                       # held between ticks
